name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -race

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build release archives
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            name="socks6-relay_${GITHUB_REF_NAME}_linux_${arch}"
            mkdir -p "dist/$name"
            for cmd in socks-ipv6-relay ndp-proxy socks-ipv6-relay-test; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" -o "dist/$name/$cmd" "./cmd/$cmd"
            done
            cp README.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects uppercase in image paths, and the owner is "33TU".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/33tu/socks6-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The Dockerfile cross-compiles from $BUILDPLATFORM, so no QEMU is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
